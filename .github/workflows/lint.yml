# Lints this repository's workflows. Required on main, so a change here,
# including an automatic dependency update, cannot merge unchecked.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Syntax, expression and shell-script errors.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Security review of the workflows (injection, excess permissions,
      # unpinned actions, credential persistence).
      #
      # No `version:` input on purpose. The action then runs the hash-locked
      # zizmor bundled with the pinned commit, so zizmor moves only when the
      # action pin does and never asks for a version this action predates
      # ("Unknown version ...; was it released after this action?").
      - name: zizmor
        # Runs even when actionlint failed, so one push shows both reports.
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
